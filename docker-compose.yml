services:
  # Tooling container: `docker compose run --rm dev <cmd>` (see Makefile)
  dev:
    build:
      context: .
      target: dev
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - golangci-cache:/root/.cache/golangci-lint
    environment:
      - GOMEMLIMIT=2GiB
      - AWS_PROFILE
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
  # Run the real app: `make run`
  app:
    build:
      context: .
      target: runtime
    init: true
    tty: true
    stdin_open: true
    environment:
      - GOMEMLIMIT=2GiB
      - AWS_PROFILE
      - AWS_REGION
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${CLOUDSSH_PEMS_DIR:-./pems}:/root/.cloudssh/pems:ro
volumes:
  go-mod-cache:
  go-build-cache:
  golangci-cache:
