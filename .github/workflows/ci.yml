name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      # golangci-lint is built from source with the repo's Go (same as the Dockerfile): the
      # prebuilt binaries are built with an older Go and refuse to lint a newer module.
      # Building takes ~2 minutes, so the binary is cached per (tool version, Go version).
      - id: tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v2.15.0-${{ runner.os }}-${{ hashFiles('go.mod') }}
      - if: steps.tool.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: ~/go/bin/golangci-lint run

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - id: tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-v1.1.4-${{ runner.os }}-${{ hashFiles('go.mod') }}
      - if: steps.tool.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: ~/go/bin/govulncheck ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is not a supported target (ssh/sh/file-mode assumptions), so it is not tested.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS runners on private repos bill at 10x and can sit in the queue for
    # a long time; never let one hold the run open.
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 ./...

  # Runs the //go:build integration tests against a real AWS account via OIDC.
  # Skipped for forks / PRs from forks (no secrets) and when the role is unset.
  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        if: env.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - if: env.AWS_ROLE_ARN != ''
        run: go test -tags integration -count=1 ./internal/provider/aws/...
