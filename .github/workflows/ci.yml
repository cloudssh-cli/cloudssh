name: ci
# CI is parked: it only runs when started by hand (Actions tab -> ci -> Run workflow).
# To turn it back on, replace the two lines below with:
#   on:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.6.0 }
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS runners on private repos bill at 10x and can sit in the queue for
    # a long time; never let one hold the run open.
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 ./...

  # Runs the //go:build integration tests against a real AWS account via OIDC.
  # Skipped for forks / PRs from forks (no secrets) and when the role is unset.
  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - if: env.AWS_ROLE_ARN != ''
        run: go test -tags integration -count=1 ./internal/provider/aws/...
