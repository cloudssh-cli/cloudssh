name: release
# Merging to main keeps a "Release PR" up to date (release-please: next version +
# changelog from Conventional Commits). Merging that PR tags the release and this
# workflow then builds the binaries (GoReleaser), attaches them to the GitHub
# Release and updates the Homebrew tap. Nobody tags by hand.
# Run it manually to dry-run GoReleaser (snapshot build, publishes nothing).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; each job asks for exactly what it needs.
permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the tag and the GitHub Release
      pull-requests: write   # open and update the Release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: [release-please]
    permissions:
      contents: write
      id-token: write   # keyless cosign signing
    # needs: + always() so the manual dry run (where release-please is skipped) still runs
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: go test -count=1 ./...
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
