name: release
# Merging to main keeps a "Release PR" up to date (release-please: next version +
# changelog from Conventional Commits). Merging that PR tags the release and this
# workflow then builds the binaries (GoReleaser), attaches them to the GitHub
# Release and updates the Homebrew tap. Nobody tags by hand.
# Run it manually to dry-run GoReleaser (snapshot build, publishes nothing).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: [release-please]
    permissions:
      contents: write
      id-token: write   # keyless cosign signing
    # needs: + always() so the manual dry run (where release-please is skipped) still runs
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -count=1 ./...
      - uses: sigstore/cosign-installer@v3.9.2
      - uses: anchore/sbom-action/download-syft@v0.20.5
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
